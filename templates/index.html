<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/bloomberg.css?v=20">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="topbar-left">
        <span class="topbar-logo">MARKET ANALYZER</span>
        <span class="topbar-divider"></span>
        <span class="topbar-label" id="lastUpdate">--:--:--</span>
    </div>
    <div class="topbar-ticker" id="tickerTrack">
        <span class="ticker-item"><span class="symbol">Yükleniyor...</span></span>
    </div>
</div>

<!-- MAIN 3-COLUMN LAYOUT -->
<div class="app-layout">

    <!-- LEFT PANEL: Market Overview -->
    <div class="panel panel-left">
        <div class="panel-header">
            <span class="panel-title">Piyasa Özeti</span>
            <button class="icon-btn" onclick="openModal()" title="Enstrüman Ekle">+</button>
        </div>
        <div class="market-table" id="sidebarList">
            <!-- Filled by JS -->
        </div>
    </div>

    <!-- CENTER PANEL: Chart + Analysis -->
    <div class="panel panel-center">
        <!-- Chart Toolbar -->
        <div class="chart-toolbar">
            <div class="toolbar-left">
                <span class="toolbar-symbol" id="tfSymbolLabel">—</span>
                <span class="toolbar-price" id="toolbarPrice"></span>
                <span class="toolbar-change" id="toolbarChange"></span>
            </div>
            <div class="toolbar-right">
                <div class="tf-group">
                    <button class="tf-btn" data-tf="1G">1G</button>
                    <button class="tf-btn" data-tf="1H">1H</button>
                    <button class="tf-btn" data-tf="1A">1A</button>
                    <button class="tf-btn active" data-tf="3A">3A</button>
                    <button class="tf-btn" data-tf="1Y">1Y</button>
                    <button class="tf-btn" data-tf="5Y">5Y</button>
                </div>
                <div class="indicator-group">
                    <button class="ind-btn" id="toggleRsi" onclick="toggleIndicator('rsi')">RSI</button>
                    <button class="ind-btn" id="toggleMacd" onclick="toggleIndicator('macd')">MACD</button>
                </div>
            </div>
        </div>

        <!-- Chart Area -->
        <div class="chart-wrapper">
            <div id="chart-area">
                <div class="chart-placeholder">Enstrüman seçin</div>
            </div>
        </div>

        <!-- Signal Strip -->
        <div class="signal-strip" id="signalStrip">
            <div class="signal-badge-main">
                <span class="signal-dot neutral"></span>
                <span class="signal-label">NÖTR</span>
            </div>
            <div class="signal-stats" id="signalStats">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL: Analysis Details -->
    <div class="panel panel-right">
        <div class="panel-header">
            <span class="panel-title">Analiz</span>
        </div>

        <!-- Opportunities Section -->
        <div class="right-section">
            <div class="section-label">Fırsatlar</div>
            <div class="opportunities-list" id="opportunities">
                <div class="dim-text">Veri yükleniyor...</div>
            </div>
        </div>

        <!-- Action Plan -->
        <div class="right-section">
            <div class="section-label">Aksiyon Planı</div>
            <div id="scenarioPanel" class="scenario-content">
                <div class="dim-text">Enstrüman seçerek analiz görüntüleyin.</div>
            </div>
        </div>

        <!-- Indicators Detail -->
        <div class="right-section">
            <div class="section-label">İndikatörler</div>
            <div id="indicatorDetail" class="indicator-detail">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Support/Resistance -->
        <div class="right-section">
            <div class="section-label">Destek / Direnç</div>
            <div id="levelsPanel" class="levels-panel">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>
</div>

<!-- ADD INSTRUMENT MODAL -->
<div id="addModal" class="modal hidden">
    <div class="modal-content">
        <h3>Enstrüman Ekle</h3>
        <input type="text" id="symbolInput" placeholder="Ticker (örn: THYAO.IS, BTC-USD)">
        <input type="text" id="nameInput" placeholder="İsim (örn: Bitcoin)">
        <select id="categorySelect">
            <option value="BIST">BIST</option>
            <option value="ABD">ABD Hisseleri</option>
            <option value="Kripto">Kripto</option>
            <option value="Forex">Forex</option>
            <option value="Emtia">Emtia</option>
        </select>
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="addInstrument()">Ekle</button>
            <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
        </div>
    </div>
</div>

<script src="/static/js/app.js?v=20"></script>
</body>
</html>
